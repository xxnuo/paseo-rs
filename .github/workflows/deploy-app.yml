name: Deploy App

on:
  push:
    branches:
      - refactor-rust
    tags:
      - "v*"
      - "!v*-beta.*"
      - "app-v*"
      - "!app-v*-beta.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-app-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'xxnuo/paseo-rs'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build app dependencies
        run: npm run build:app-deps

      - name: Typecheck
        run: npm run typecheck --workspace=@getpaseo/app

      - name: Build web assets
        run: npm run build:web --workspace=@getpaseo/app

      - name: Deploy to Cloudflare Pages
        working-directory: packages/app
        run: npx --no-install wrangler pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch refactor-rust
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
