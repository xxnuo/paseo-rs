[package]
name = "paseo-nsh"
version = "0.15.2"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = { path = "../../../../nsh/crates/nsh-core" }
nsh-base = { path = "../../../../nsh/crates/nsh-base", default-features = false }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "js"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[dev-dependencies]
nsh-engine = { path = "../../../../nsh/crates/nsh-engine", default-features = false }
nsh-testing = { path = "../../../../nsh/crates/nsh-testing", default-features = false, features = ["live"] }
